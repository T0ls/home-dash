# Service list, split into groups.
#
# Each service accepts:
#   href:        link to open (required to make it clickable)
#   description: short description
#   icon:        - name from https://dashboard-icons.homarr.dev (e.g. jellyfin, proxmox)
#                - "si-<name>" for Simple Icons (e.g. si-github)
#                - an image URL (https://...)
#                - an emoji (e.g. 🎬)
#   ping:        alternate URL for the status check (e.g. an internal address),
#                or false to disable it
#   target:      _blank or _self, overrides the global setting

