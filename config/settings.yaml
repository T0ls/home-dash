# General dashboard settings.
# Changes apply on the next page refresh — no container restart needed.

title: Homepage
subtitle: Your services, one click away.

# Max number of columns on large screens (1-6).
columns: 4

# How to open links: _blank (new tab) or _self (same tab).
target: _blank

# Download Dashboard Icons and Simple Icons into the data folder the first time
# they are shown, then serve that copy. The dashboard can then show those icons
# with no internet. Your own files in the icons/ folder (next to config/) are
# always served locally, whether this is on or off.
# When choosing icon: in services.yaml or bookmarks.yaml, browse examples at
# https://dashboardicons.com/
cacheIcons: false

# Check whether services are reachable (green/red status dot).
statusCheck: true
# How often to re-check, in seconds.
statusInterval: 60

showClock: true

# Users via Authelia (forward auth on nginx).
# nginx must forward the Authelia identity headers to the container, for example:
#   auth_request_set $user   $upstream_http_remote_user;
#   auth_request_set $name   $upstream_http_remote_name;
#   auth_request_set $email  $upstream_http_remote_email;
#   auth_request_set $groups $upstream_http_remote_groups;
#   proxy_set_header Remote-User   $user;
#   proxy_set_header Remote-Name   $name;
#   proxy_set_header Remote-Email  $email;
#   proxy_set_header Remote-Groups $groups;
auth:
  enabled: true
  headers:
    user: Remote-User
    name: Remote-Name
    email: Remote-Email
    groups: Remote-Groups
  # Optional links shown in the user menu.
  # accountUrl: https://auth.example.com/settings
  # logoutUrl: https://auth.example.com/logout

# Optional background image URL. Leave commented for the default look.
# backgroundImage: https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920
# backgroundBlur: 8          # 0-40
# backgroundOpacity: 0.35    # 0-1, how visible the image is under the dark overlay
