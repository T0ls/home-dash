services:
  homepage:
    build: .
    image: homepage-dashboard:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Holds settings.yaml, services.yaml, bookmarks.yaml and users.yaml.
      # If empty on first start, it is seeded with the example files.
      - ./config:/app/config
