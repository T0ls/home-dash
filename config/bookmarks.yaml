# Quick links / bookmarks, shown above the services.
# Same grouped format as services.yaml.
# Optional per-item access: users: [mario] and/or groups: [admins]
# (omit both to show the bookmark to everyone).
#
# icon: same choices as services.yaml (catalog name, si-<name>, a file in
# icons/, an image URL, or an emoji). Browse examples at
# https://dashboardicons.com/

- Favorites:
    - YouTube:
        href: https://youtube.com
        icon: si-youtube
    - Reddit:
        href: https://reddit.com
        icon: si-reddit
    - Gmail:
        href: https://mail.google.com
        icon: si-gmail
    - Maps:
        href: https://maps.google.com
        icon: 🗺️
