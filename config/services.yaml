# Elenco dei servizi, divisi in gruppi.
#
# Ogni servizio accetta:
#   href:        link da aprire (obbligatorio per renderlo cliccabile)
#   description: breve descrizione
#   icon:        - nome da https://dashboard-icons.homarr.dev (es. jellyfin, proxmox)
#                - "si-<nome>" per Simple Icons (es. si-github)
#                - URL di un'immagine (https://...)
#                - un'emoji (es. 🎬)
#   ping:        URL alternativo da usare per il controllo di stato
#                (es. indirizzo interno), oppure false per disattivarlo
#   target:      _blank o _self, sovrascrive l'impostazione globale

