# Service list, split into groups.
#
# Each service accepts:
#   href:        link to open (required to make it clickable)
#   description: short description
#   icon:        - name from https://dashboard-icons.homarr.dev (e.g. jellyfin, proxmox).
#                  Browse examples at https://dashboardicons.com/
#                - "si-<name>" for Simple Icons (e.g. si-github)
#                - a file in the icons/ folder of the data volume (e.g. logo.png)
#                - an image URL (https://...)
#                - an emoji (e.g. 🎬)
#   ping:        alternate URL for the status check (e.g. an internal address),
#                or false to disable it
#   target:      _blank or _self, overrides the global setting
#   users:       list of Authelia usernames or displayNames that may see it
#   groups:      list of Authelia groups that may see it
#                (omit both users and groups to show it to everyone;
#                 role: admin in users.yaml always sees every service;
#                 single-user mode (the default) shows every service to the local user)

