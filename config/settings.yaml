# Impostazioni generali della dashboard.
# Le modifiche sono applicate al prossimo refresh della pagina, senza riavviare il container.

title: Homepage
subtitle: I tuoi servizi, a portata di clic.

# Numero massimo di colonne della griglia su schermi grandi (1-6).
columns: 4

# Come aprire i link: _blank (nuova scheda) o _self (stessa scheda).
target: _blank

# Controlla se i servizi sono raggiungibili (pallino verde/rosso).
statusCheck: true
# Ogni quanti secondi ripetere il controllo.
statusInterval: 60

showClock: true

# Utenti tramite Authelia (forward auth su nginx).
# nginx deve inoltrare al container gli header con i dati dell'utente, per esempio:
#   auth_request_set $user   $upstream_http_remote_user;
#   auth_request_set $name   $upstream_http_remote_name;
#   auth_request_set $email  $upstream_http_remote_email;
#   auth_request_set $groups $upstream_http_remote_groups;
#   proxy_set_header Remote-User   $user;
#   proxy_set_header Remote-Name   $name;
#   proxy_set_header Remote-Email  $email;
#   proxy_set_header Remote-Groups $groups;
auth:
  enabled: true
  headers:
    user: Remote-User
    name: Remote-Name
    email: Remote-Email
    groups: Remote-Groups
  # Link opzionali mostrati nel menu utente.
  # accountUrl: https://auth.example.com/settings
  # logoutUrl: https://auth.example.com/logout

# Sfondo opzionale (URL di un'immagine). Lascia commentato per lo sfondo di default.
# backgroundImage: https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920
# backgroundBlur: 8          # 0-40
# backgroundOpacity: 0.35    # 0-1, quanto l'immagine è visibile sotto il velo scuro
