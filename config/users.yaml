# Dashboard users.
#
# There is no password login: identity comes from Authelia via the headers
# nginx forwards to the container (see the "auth" section in settings.yaml).
# A user is matched by comparing `displayName` to Authelia's displayname
# (case-insensitive). If that fails, `username` is tried next.
#
# Fields:
#   displayName: required, must match Authelia's displayname
#   username:    optional, Authelia username
#   email:       optional, used if Authelia does not send one
#   avatar:      optional, profile image URL
#   role:        optional, label shown in the profile (e.g. Admin)

users:
  - displayName: Mario Rossi
    username: mario
    email: mario@example.com
    role: Admin
  - displayName: Giulia Bianchi
    username: giulia
    role: Family
